name: CI/CD Pipeline - LAB CICD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  # -------------------------------
  # JOB A — QUALITY CHECK (CI)
  # -------------------------------
  quality-check:
    name: Quality Check (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install htmlhint
        run: npm install -g htmlhint

      - name: Run HTMLHint
        run: htmlhint "**/*.html"

      - name: Broken Link Checker
        uses: lycheeverse/lychee-action@v1
        with:
          args: --verbose --no-progress ./


  # -------------------------------
  # JOB B — CONTAINER REGISTRY (GHCR)
  # -------------------------------
  container-registry:
    name: Publish Docker Image to GHCR
    needs: quality-check
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/lab-cicd:latest


  # -------------------------------
  # JOB C — DEPLOYMENT (GITHUB PAGES)
  # -------------------------------
  deployment:
    name: Deploy static site to GitHub Pages
    needs: container-registry
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Prepara gli artifact per GitHub Pages
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./

      # Deploy su GitHub Pages
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

name: CI/CD Pipeline - LAB CICD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  # -------------------------------
  # JOB A — QUALITY CHECK (CI)
  # -------------------------------
  quality-check:
    name: Quality Check (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Installazione HTMLHint
      - name: Install htmlhint
        run: npm install -g htmlhint

      # Linting HTML
      - name: Run HTMLHint
        run: htmlhint "**/*.html"

      # Link Checker (Lychee)
      - name: Broken Link Checker
        uses: lycheeverse/lychee-action@v1
        with:
          args: --verbose --no-progress ./


  # -------------------------------
  # JOB B — CONTAINER REGISTRY (GHCR)
  # -------------------------------
  container-registry:
    name: Publish Docker Image to GHCR
    needs: quality-check
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Login al GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build & Push dell'immagine Docker
      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/lab-cicd:latest
